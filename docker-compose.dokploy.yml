services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: opi-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 90s

  minio:
    image: minio/minio:latest
    container_name: opi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: opi-api
    restart: unless-stopped
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      mssql:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 3000

      # DB (Prisma adapter uses these directly)
      DB_HOST: mssql
      DB_PORT: 1433
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ENCRYPT: ${DB_ENCRYPT:-false}
      DB_TRUST_CERT: ${DB_TRUST_CERT:-true}

      # Also needed by prisma migrate command in container startup
      DATABASE_URL: ${DATABASE_URL}

      # API / CORS / auth mode
      CORS_ORIGIN: ${CORS_ORIGIN}
      AUTH_MOCK: ${AUTH_MOCK:-false}

      # Auth0 (required when AUTH_MOCK=false)
      AUTH0_ISSUER: ${AUTH0_ISSUER}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}

      # Audio settings
      MAX_AUDIO_MB: ${MAX_AUDIO_MB:-50}
      AUDIO_STORAGE_PROVIDER: ${AUDIO_STORAGE_PROVIDER:-minio}
      AUDIO_S3_BUCKET: ${AUDIO_S3_BUCKET}
      AUDIO_S3_REGION: ${AUDIO_S3_REGION:-us-east-1}
      AUDIO_S3_ACCESS_KEY_ID: ${AUDIO_S3_ACCESS_KEY_ID}
      AUDIO_S3_SECRET_ACCESS_KEY: ${AUDIO_S3_SECRET_ACCESS_KEY}
      AUDIO_S3_ENDPOINT: ${AUDIO_S3_ENDPOINT:-http://minio:9000}
      AUDIO_S3_FORCE_PATH_STYLE: ${AUDIO_S3_FORCE_PATH_STYLE:-true}
      AUDIO_S3_SIGNED_URL_EXPIRES_SECONDS: ${AUDIO_S3_SIGNED_URL_EXPIRES_SECONDS:-3600}

    ports:
      - "3001:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-auth0}
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-}
        VITE_AUTH0_REDIRECT_URI: ${VITE_AUTH0_REDIRECT_URI:-}
    container_name: opi-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  mssql-data:
  minio-data:
